name: test

# 기능 브랜치를 main으로 바로 머지하는 흐름이라 push마다 돌린다.
# pull_request는 바깥에서 들어오는 변경을 위해 함께 둔다.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # pretest 훅이 server/data의 기본 파일을 먼저 만든다. 그 디렉터리는
      # 커밋하지 않으므로 CI에는 비어 있고, 없으면 관리자 화면을 다루는
      # 테스트가 코드와 무관하게 실패한다.
      - run: npm test
