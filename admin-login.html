<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 · SNU ECE 공지방</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin-login.css">
</head>
<body>
    <main class="login-shell">
        <a class="login-brand" href="./index.html" aria-label="공지방 홈으로 돌아가기">
            <img src="./icons/snu-emblem-navy.png" alt="">
            <span>SNU ECE 공지방</span>
        </a>
        <section class="login-card" aria-labelledby="admin-login-title">
            <p class="login-eyebrow">ADMIN ACCESS</p>
            <h1 id="admin-login-title">관리자 로그인</h1>
            <p>공지 검수와 운영 도구는 인증된 관리자만 사용할 수 있습니다.</p>
            <form id="admin-login-form" novalidate>
                <label for="admin-login-password">관리자 비밀번호</label>
                <input type="password" id="admin-login-password" value="" autocomplete="current-password"
                       data-1p-ignore data-lpignore="true" required autofocus>
                <p id="admin-login-error" role="alert" aria-live="polite"></p>
                <button type="submit">로그인</button>
            </form>
        </section>
    </main>
    <script src="./js/admin-login.js"></script>
</body>
</html>
