<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 · SNU ECE 공지방</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin-login.css">
</head>
<body>
    <main class="login-shell">
        <a class="login-brand" href="./index.html" aria-label="공지방 홈으로 돌아가기">
            <img src="./icons/snu-emblem-navy.png" alt="">
            <span>SNU ECE 공지방</span>
        </a>
        <section class="login-card" aria-labelledby="admin-login-title">
            <p class="login-eyebrow">ADMIN ACCESS</p>
            <h1 id="admin-login-title">관리자 로그인</h1>
            <p>등록된 서울대학교 Google 계정으로 로그인하세요.</p>
            <form id="admin-login-form">
                <p id="admin-login-error" role="alert" aria-live="polite"></p>
                <button type="submit">Google 계정으로 로그인</button>
            </form>
            <a class="login-back" href="./index.html">‹ 공지방으로 돌아가기</a>
        </section>
    </main>
    <!-- config.js가 window.API_BASE_URL을 정한다. 이 화면은 core.js를 싣지 않으므로 직접 필요하다. -->
    <script src="./js/config.js"></script>
    <script src="./js/admin-login.js"></script>
</body>
</html>
